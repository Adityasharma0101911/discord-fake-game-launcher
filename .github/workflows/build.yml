name: Build

# Releases are built locally (npm run release); this is only for a clean-machine check when started by hand.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      # Rust is preinstalled on windows-latest; this also builds src/dummygame.
      - name: Build installer
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: EndosDiscordGameSpoofer-Setup
          path: src-tauri/target/release/bundle/nsis/*.exe
