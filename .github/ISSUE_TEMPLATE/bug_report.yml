name: Bug report
description: Something doesn’t work the way it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        I added VALORANT and clicked Launch. The log said it launched, but Discord showed nothing.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - The app window
        - The fake game window
        - Discord not detecting a game
        - Tray icon
        - Updates
        - Downloading Discord’s game list
        - Something else
    validations:
      required: true

  - type: input
    id: game
    attributes:
      label: Game and executable
      description: The game name and the exe path shown under it in the app, if it’s about one game.
      placeholder: "VALORANT – riot client/valorant.exe"

  - type: textarea
    id: log
    attributes:
      label: Activity log
      description: Copy the lines from the log at the bottom of the app.
      render: text

  - type: input
    id: version
    attributes:
      label: App version
      description: Settings → Apps → Installed apps, or the release you downloaded.
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: system
    attributes:
      label: Windows version and anything unusual
      description: Antivirus, Discord PTB/Canary, overlays.
      placeholder: "Windows 11 24H2, Discord stable"
